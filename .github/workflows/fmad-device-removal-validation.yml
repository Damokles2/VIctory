name: FMad device removal Windows MSVC validation

on:
  push:
    branches: [ci/fmad-device-removal-validation]

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'Damokles2/VIctory' && github.event.deleted == false
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      BASE_SHA: 940d32f69b22265690a0b5a15d6ded572ba33baf
      PATCH_SHA: de9a0315887daf72fb4edf7a7d6dc6673ec32cf6
      FMAD_SOURCE: crates/victory-shader/src/emit/host.rs
      MSVC_TARGET: x86_64-pc-windows-msvc
      FMAD_TEST_PREFIX: 'emit::host::fmad_wait_tests::'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '0'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 3

      - name: Verify and prepare source trees
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA -or (git rev-parse HEAD^) -cne $env:PATCH_SHA -or (git rev-parse HEAD^^) -cne $env:BASE_SHA) {
            throw 'Unexpected validation, contribution, or upstream commit'
          }
          if ((git diff --name-only $env:BASE_SHA $env:PATCH_SHA) -cne $env:FMAD_SOURCE) {
            throw 'Unexpected contribution diff'
          }
          git diff --check $env:BASE_SHA $env:PATCH_SHA
          $baseline = Join-Path $env:RUNNER_TEMP 'fmad-baseline'
          $patched = Join-Path $env:RUNNER_TEMP 'fmad-patched'
          $patch = Join-Path $env:GITHUB_WORKSPACE '.github/validation/fmad-test-only-baseline.patch'
          git worktree add --detach $baseline $env:BASE_SHA
          git worktree add --detach $patched $env:PATCH_SHA
          git -C $baseline apply --check --index $patch
          git -C $baseline apply --index $patch
          if ((git -C $baseline diff --cached --name-only) -cne $env:FMAD_SOURCE -or (git -C $baseline diff --name-only)) {
            throw 'Unexpected test-only changes'
          }
          git -C $baseline diff --cached --check
          $baselineSource = [IO.File]::ReadAllText((Join-Path $baseline $env:FMAD_SOURCE))
          $patchedSource = [IO.File]::ReadAllText((Join-Path $patched $env:FMAD_SOURCE))
          $guardLines = @(
            '    // A removed device reports u64::MAX, which also exits the wait.'
            '    if let Err(e) = device_status() {'
            '        return Err(format!("device removed: {}", err(e)));'
            '    }'
            ''
          )
          $guard = $guardLines -join "`n"
          if ([regex]::Matches($patchedSource, [regex]::Escape($guard)).Count -ne 1 -or $patchedSource.Replace($guard, '') -cne $baselineSource) {
            throw 'Baseline and contribution differ beyond the post-wait guard'
          }
          "BASELINE_PATH=$baseline" >> $env:GITHUB_ENV
          "PATCHED_PATH=$patched" >> $env:GITHUB_ENV
          'Source verification passed. The post-wait guard is the only baseline-to-patched difference.' >> $env:GITHUB_STEP_SUMMARY

      - name: Install pinned Rust toolchain
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install
          rustc -vV

      - name: Compile baseline tests
        working-directory: ${{ env.BASELINE_PATH }}
        run: cargo test --locked --target $env:MSVC_TARGET -p victory-shader --lib --no-run

      - name: Verify baseline immediate removal reaches readback
        working-directory: ${{ env.BASELINE_PATH }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $result = @(cargo test --locked --target $env:MSVC_TARGET -p victory-shader --lib $env:FMAD_TEST_PREFIX 2>&1 | ForEach-Object ToString)
          $exitCode = $LASTEXITCODE
          $result | Write-Output
          $failed = "$($env:FMAD_TEST_PREFIX)immediate_removal_skips_readback"
          $panics = @($result -cmatch "^thread '[^']+'(?: \(\d+\))? panicked at ")
          $diagnostic = 'assertion `left == right` failed: unexpected readback count'
          $details = @($diagnostic, '  left: 1', ' right: 0') -join "`n"
          if ($exitCode -ne 101 -or $result -cnotcontains 'running 4 tests' -or $result -cnotcontains "test $failed ... FAILED" -or @($result -cmatch '^test result: FAILED\. 3 passed; 1 failed; 0 ignored; 0 measured;').Count -ne 1 -or $panics.Count -ne 1 -or $panics[0] -cnotmatch "^thread '$([regex]::Escape($failed))'(?: \(\d+\))? panicked at " -or !(($result -join "`n").Contains($details))) {
            throw 'Baseline did not fail solely because immediate removal invoked readback once'
          }
          foreach ($name in @('ordinary_completion_reads_back_once', 'removal_during_polling_skips_readback', 'immediate_healthy_completion_reads_back_once')) {
            if ($result -cnotcontains "test $($env:FMAD_TEST_PREFIX)$name ... ok") {
              throw "Expected baseline test did not pass: $name"
            }
          }
          'Baseline FMad regression: 3 passed, 1 expected failure in immediate_removal_skips_readback.' >> $env:GITHUB_STEP_SUMMARY
          '' >> $env:GITHUB_STEP_SUMMARY
          "    $diagnostic" >> $env:GITHUB_STEP_SUMMARY
          '      left: 1' >> $env:GITHUB_STEP_SUMMARY
          '     right: 0' >> $env:GITHUB_STEP_SUMMARY
          exit 0

      - name: Run patched CPU-only tests
        working-directory: ${{ env.PATCHED_PATH }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          function Assert-CpuTests {
            param([string]$Filter, [string[]]$Names)
            $result = @(cargo test --locked --target $env:MSVC_TARGET -p victory-shader --lib $Filter 2>&1 | ForEach-Object ToString)
            $exitCode = $LASTEXITCODE
            $result | Write-Output
            if ($exitCode -ne 0 -or $result -cnotcontains "running $($Names.Count) tests" -or @($result -cmatch "^test result: ok\. $($Names.Count) passed; 0 failed; 0 ignored; 0 measured;").Count -ne 1) {
              throw "Unexpected test outcome for $Filter"
            }
            foreach ($name in $Names) {
              if ($result -cnotcontains "test $Filter$name ... ok") {
                throw "Expected test did not pass: $Filter$name"
              }
            }
            "- $Filter $($Names.Count) passed, 0 failed." >> $env:GITHUB_STEP_SUMMARY
          }
          Assert-CpuTests -Filter $env:FMAD_TEST_PREFIX -Names @(
            'immediate_removal_skips_readback',
            'ordinary_completion_reads_back_once',
            'removal_during_polling_skips_readback',
            'immediate_healthy_completion_reads_back_once'
          )
          Assert-CpuTests -Filter 'dxbc::tests::' -Names @('round_trips_parts', 'rejects_bad_input')

      - name: Strict Clippy with default features
        working-directory: ${{ env.PATCHED_PATH }}
        run: cargo clippy --locked --target $env:MSVC_TARGET -p victory-shader --all-targets -- -D warnings

      - name: Strict Clippy with all features
        working-directory: ${{ env.PATCHED_PATH }}
        run: cargo clippy --locked --target $env:MSVC_TARGET -p victory-shader --all-targets --all-features -- -D warnings

      - name: Check formatting against upstream
        working-directory: ${{ env.PATCHED_PATH }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git diff --check $env:BASE_SHA $env:PATCH_SHA
          $upstream = Join-Path $env:RUNNER_TEMP 'upstream-fmad-host.rs'
          $upstreamLines = git show "$($env:BASE_SHA):$($env:FMAD_SOURCE)"
          [IO.File]::WriteAllText($upstream, ($upstreamLines -join "`n") + "`n")
          $PSNativeCommandUseErrorActionPreference = $false
          $before = @(rustfmt --check --edition 2024 $upstream 2>&1 | ForEach-Object ToString)
          $beforeExit = $LASTEXITCODE
          $after = @(rustfmt --check --edition 2024 $env:FMAD_SOURCE 2>&1 | ForEach-Object ToString)
          $afterExit = $LASTEXITCODE
          $after | Write-Output
          $beforeDiff = $before -creplace '^Diff in .*:(\d+):$', 'Diff at line $1'
          $afterDiff = $after -creplace '^Diff in .*:(\d+):$', 'Diff at line $1'
          if ($beforeExit -notin 0,1 -or $afterExit -ne $beforeExit -or ($beforeDiff -join "`n") -cne ($afterDiff -join "`n") -or ($afterExit -eq 1 -and @($afterDiff -cmatch '^Diff at line ').Count -eq 0)) {
            throw 'Formatting differs from upstream or rustfmt could not check the files'
          }
          '- Git whitespace check passed. Rustfmt reported no new differences relative to upstream.' >> $env:GITHUB_STEP_SUMMARY
          exit 0
